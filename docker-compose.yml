services:
  power-monitor:
    build: .
    container_name: power_supply_monitor
    ports:
      - "8095:8095"
    restart: always
    environment:
      - NTFY_URL=https://ntfy.sh
      - NTFY_TOPIC=tu_topic_privado
      - SUPPLY_PATH=/sys/class/power_supply
      - AC_SUPPLY_NAME=AC0
      - CHECK_INTERVAL=5
      - FLUCTUATION_NOTIFY_COOLDOWN_SECONDS=600
      - LOG_LEVEL=INFO
      - LATITUDE=0.0
      - LONGITUDE=0.0
    volumes:
      - /sys/class/power_supply:/sys/class/power_supply:ro
      - ./logs:/app/logs
      - ./instance:/app/instance
