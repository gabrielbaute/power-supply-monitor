<!-- Encabezado HTML y metas del correo -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ mail_title | default('Notificación de Sistema') }}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333333;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border: 1px solid #e1e8ed;
        }
        .header-box {
            padding: 25px 20px;
            text-align: center;
            color: #ffffff;
        }
        /* Variaciones estéticas del Banner según el tipo de alerta */
        .bg-danger { background-color: #d9534f; }
        .bg-success { background-color: #2eb85c; }
        .bg-info { background-color: #3399ff; }
        .bg-warning { background-color: #f0ad4e; }
        .bg-default { background-color: #2c3e50; }

        .header-box h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .header-box p {
            margin: 5px 0 0 0;
            font-size: 13px;
            opacity: 0.9;
        }
        .content {
            padding: 30px 25px;
            line-height: 1.6;
            font-size: 15px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        .data-table th, .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eef2f5;
            text-align: left;
        }
        .data-table th {
            background-color: #f8fafc;
            color: #64748b;
            font-size: 13px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
        }
        .footer {
            background-color: #f8fafc;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
