[project]
name = "power-supply-monitor"
version = "0.6.0"
description = "Una sencilla aplicación en python para alertar si hay fallas en el suministro eléctrico."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "passlib>=1.7.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose>=3.5.0",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "bumpver>=2026.1132",
]
